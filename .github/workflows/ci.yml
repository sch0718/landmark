name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 'Run the extended E2E regression suite'
        type: boolean
        default: false

# 같은 브랜치·PR에 새 커밋이 오면 진행 중인 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 단위 시험·빌드와 E2E는 서로 기다리지 않도록 작업을 나눠 동시에 돈다. 한 작업에 이어 붙이면
  # 느린 러너에서 합이 20분에 닿아 취소됐다(2026-10-27, build:ci 7.5분 + 핵심 E2E 10분).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # 개발 의존성 engines가 package.json engines보다 좁은 문제는 저장소의 .yarnrc(ignore-engines true)가
      # 처리한다. Cloudflare Pages와 같은 명령으로 설치한다(README 참고).
      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # 오픈소스 고지(public/third-party-notices.txt)가 설치된 의존성과 맞는지 확인한다.
      - name: Third-party notices
        run: node scripts/build-notices.mjs --check

      # Cloudflare Pages 빌드 명령과 같다: validate → typecheck → 단위 테스트 → 빌드.
      - name: Build (build:ci)
        run: yarn build:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium webkit

      - name: E2E (core flows)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_e2e }}
        run: yarn test:e2e:ci

      - name: E2E (extended regression)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_e2e }}
        run: yarn test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
